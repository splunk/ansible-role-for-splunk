---
# Ansible collections required by this role at runtime.
# Install with: ansible-galaxy collection install -r requirements.yml
collections:
  - name: ansible.posix
    version: ">=1.4.0"
  - name: community.general
    version: ">=6.0.0"
  # Only required when an app uses download_app_source: s3 (also needs boto3/botocore via pip).
  - name: amazon.aws
    version: ">=6.0.0"
