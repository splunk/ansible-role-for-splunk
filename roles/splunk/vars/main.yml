---
# Automatically determine desired splunk version string
splunk_file: "{{ splunk_package_url | regex_search('(splunk(?:forwarder)?\\-\\d+[^/]*\\.tgz)') }}"
splunk_v: "{{ splunk_package_url | regex_search('(\\d+\\.\\d+\\.\\d+(?:\\.\\d+)?)') }}"
splunk_build: "{{ splunk_package_url | regex_search('\\d+\\.\\d+\\.\\d+(?:\\.\\d+)?\\-([^-]+)', '\\1') | first }}"
# Create desired splunk version string (to compare with the output from the splunk version command for upgrades)
splunk_version: "{{ splunk_product }} {{ splunk_v }} (build {{ splunk_build }})"
splunk_auth: "{{ splunk_admin_username }}:{{ splunk_admin_password }}"
firewall_service: ufw

splunk_app_path_registry:
  etc/master-apps: apply indexer cluster bundle
  etc/manager-apps: apply indexer cluster bundle
  etc/deployment-apps: reload deployment server
  etc/shcluster/apps: apply shcluster-bundle
  etc/apps: restart splunk

splunk_app_group_path_map:
  clustermanager: etc/master-apps
  shdeployer: etc/shcluster/apps
  deploymentserver: etc/deployment-apps

splunk_app_staging_dir: "{{ git_local_clone_path }}{{ inventory_hostname }}"

splunk_app_list: "{{ (apps | default(git_apps) | default([])) or [] }}"

splunk_apps_remove_list: "{{ (splunk_apps_to_remove | default([])) or [] }}"

splunk_app_name_pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]*$'

splunk_app_remove_path_pattern: '^etc/([A-Za-z0-9_.-]+/)*[A-Za-z0-9_.-]*apps$'
