---
- name: Set default splunk_app_deploy_path based on group membership
  block:
    - name: Set default splunk_app_deploy_path for clustermanager hosts
      ansible.builtin.set_fact:
        splunk_app_deploy_path: etc/master-apps
      when: "'clustermanager' in group_names"

    - name: Set default splunk_app_deploy_path for shdeployer hosts
      ansible.builtin.set_fact:
        splunk_app_deploy_path: etc/shcluster/apps
      when: "'shdeployer' in group_names"

    - name: Set default splunk_app_deploy_path for deploymentserver hosts
      ansible.builtin.set_fact:
        splunk_app_deploy_path: etc/deployment-apps
      when: "'deploymentserver' in group_names"

    - name: "Set default splunk_app_deploy_path all other hosts"
      ansible.builtin.set_fact:
        splunk_app_deploy_path: "etc/apps"
      when:
        - "'clustermanager' not in group_names"
        - "'shdeployer' not in group_names"
        - "'deploymentserver' not in group_names"
  when: splunk_app_deploy_path is undefined or splunk_app_deploy_path == 'undefined'

- name: Deploy apps
  when: splunk_app_list | length > 0
  block:
    - name: Validate app source types
      ansible.builtin.assert:
        that: item.download_app_source | default('git') in ['git', 's3']
        fail_msg: "Unsupported download_app_source '{{ item.download_app_source | default('git') }}' for app '{{ item.name }}'. Allowed: git, s3"
      loop: "{{ splunk_app_list }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Require a version for convention-path S3 apps
      ansible.builtin.assert:
        that: item.version is defined
        fail_msg: >-
          S3 app '{{ item.name }}' needs a 'version' (it forms the <app_id>/<version>/
          prefix). Set version, or use the full-key s3_object override.
      when:
        - item.download_app_source | default('git') == 's3'
        - item.s3_object is not defined
      loop: "{{ splunk_app_list }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Partition app list by source and collect distinct destinations
      ansible.builtin.set_fact:
        _git_apps: "{{ splunk_app_list | rejectattr('download_app_source', 'defined') | list
                     + splunk_app_list | selectattr('download_app_source', 'defined')
                       | selectattr('download_app_source', 'equalto', 'git') | list }}"
        _s3_apps: "{{ splunk_app_list | selectattr('download_app_source', 'defined')
                    | selectattr('download_app_source', 'equalto', 's3') | list }}"
        _deploy_paths: "{{ splunk_app_list
                         | map(attribute='splunk_app_deploy_path', default=splunk_app_deploy_path)
                         | unique | list }}"

    - name: Require git vars to be configured for git apps
      ansible.builtin.assert:
        that:
          - (item.git_server | default(git_server)) != 'undefined'
          - (item.git_project | default(git_project)) != 'undefined'
          - (item.git_key | default(git_key)) != 'undefined'
        fail_msg: >-
          git app '{{ item.name }}' needs git_server, git_project, and git_key configured
          (globally in group_vars or per-app). One or more is still 'undefined'.
      loop: "{{ _git_apps }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Create local working directory for app staging
      ansible.builtin.file:
        path: "{{ splunk_app_staging_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      changed_when: false

    - name: Create per-destination staging roots
      ansible.builtin.file:
        path: "{{ splunk_app_staging_dir }}/{{ _deploy_path }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      changed_when: false
      loop: "{{ _deploy_paths }}"
      loop_control:
        loop_var: _deploy_path
        label: "{{ _deploy_path }}"

    - name: Ensure rsync is installed on target host
      ansible.builtin.package:
        name: rsync
        state: present
        update_cache: true
      become: true

    - name: Comment out requiretty in sudoers as it causes synchronize to fail on target host
      ansible.builtin.lineinfile:
        dest: "/etc/sudoers"
        state: present
        regexp: "^#?{{ item }}"
        line: "#{{ item }}"
        create: true
        owner: root
        group: root
        mode: "0440"
      loop:
        - "Defaults    requiretty"
      become: true

    - name: Clone all git apps into the isolated work area
      ansible.builtin.git:
        accept_hostkey: true
        repo: "{{ item.git_server | default(git_server) }}/{{ item.git_project | default(git_project) }}/{{ item.name }}"
        version: "{{ item.git_version | default(git_version) }}"
        dest: "{{ splunk_app_staging_dir }}/__work/{{ item.name }}"
        key_file: "{{ item.git_key | default(git_key) }}"
        force: true
      loop: "{{ _git_apps }}"
      delegate_to: localhost
      changed_when: false
      check_mode: false
      retries: 10
      delay: 10
      register: _git_clone
      until: _git_clone is not failed
      loop_control:
        label: "{{ item.name }}"

    - name: Place each git app into its destination staging tree
      ansible.builtin.command:
        argv:
          - rsync
          - "--archive"
          - "--exclude=.git"
          - "--exclude=.gitignore"
          - "{{ splunk_app_staging_dir }}/__work/{{ item.name }}{{ item.app_relative_path | default(app_relative_path) }}"
          - "{{ splunk_app_staging_dir }}/{{ item.splunk_app_deploy_path | default(splunk_app_deploy_path) }}/"
      delegate_to: localhost
      changed_when: false
      loop: "{{ _git_apps }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Fetch all S3 apps into their destination staging trees
      ansible.builtin.include_tasks: splunk_apps/fetch_s3.yml
      loop: "{{ _s3_apps }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Stage .rsync-filter at each destination's transfer root
      ansible.builtin.copy:
        src: rsync-filter
        dest: "{{ splunk_app_staging_dir }}/{{ _deploy_path }}/.rsync-filter"
        mode: "0644"
      delegate_to: localhost
      changed_when: false
      loop: "{{ _deploy_paths }}"
      loop_control:
        loop_var: _deploy_path
        label: "{{ _deploy_path }}"

    - name: Make staging tree readable by the splunk rsync sender
      ansible.builtin.file:
        path: "{{ splunk_app_staging_dir }}"
        mode: "a+rX"
        recurse: true
      delegate_to: localhost
      changed_when: false

    - name: Install each destination's apps in one batched sync
      ansible.builtin.include_tasks: splunk_apps/install_apps.yml
      loop: "{{ _deploy_paths }}"
      loop_control:
        loop_var: _deploy_path
        label: "{{ _deploy_path }}"
      vars:
        app_dest: "{{ _deploy_path }}"
        handler: "{{ splunk_app_handler_map[_deploy_path] | default('restart splunk') }}"

    - name: Ensure correct ownership of deployed apps on target host
      ansible.builtin.file:
        path: "{{ splunk_home }}/{{ _deploy_path }}"
        owner: "{{ splunk_nix_user }}"
        group: "{{ splunk_nix_group }}"
        recurse: true
      become: true
      loop: "{{ _deploy_paths }}"
      loop_control:
        loop_var: _deploy_path

  always:
    - name: Cleanup local app staging directory
      ansible.builtin.file:
        path: "{{ splunk_app_staging_dir }}"
        state: absent
      delegate_to: localhost
      changed_when: false
      check_mode: false

- name: Remove apps
  ansible.builtin.include_tasks: splunk_apps/remove_apps.yml
  when: splunk_apps_to_remove | default([]) | length > 0
