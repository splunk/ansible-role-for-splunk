---
- name: Resolve and validate the app plan
  ansible.builtin.include_tasks: splunk_apps/resolve.yml

- name: Deploy apps
  ansible.builtin.include_tasks: splunk_apps/deploy.yml
  when: splunk_apps_resolved | length > 0

- name: Remove apps
  ansible.builtin.include_tasks: splunk_apps/remove_apps.yml
  when: splunk_apps_remove_resolved | length > 0

- name: Flush pending app handlers
  ansible.builtin.meta: flush_handlers
