---
# group_vars for deployment server
splunk_app_deploy_path: etc/deployment-apps
git_version: master
apps:
  # Cloning from a different git server and deploying to a non-default path
  - name: my_outputs
    download_app_source: git
    git_version: 1.0.0
    git_server: ssh://git@anotherserver.com
    git_key: ~/.ssh/anotherkey
    git_project: SPLK
    splunk_app_deploy_path: etc/apps
  - name: disable_rest
    download_app_source: git

# Apps to remove, processed after deployment. Deploy path defaults like
# deployments, so override it for apps placed off the group default. On a
# deployment server, also remove the app from serverclass.conf.
splunk_apps_to_remove:
  - name: my_old_outputs
    splunk_app_deploy_path: etc/apps
  - name: deprecated_ta
